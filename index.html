<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2b1d">
  <meta name="description" content="A classic Nokia-inspired Snake game for the web">
  <title>Nokia Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <div class="phone" role="application" aria-label="Nokia Snake game">
      <div class="brand">NOKIA</div>

      <section class="screen-wrap">
        <div class="lcd">
          <div class="status" aria-live="polite">
            <span>SNAKE</span>
            <span>SCORE <strong id="score">0000</strong></span><span>HI <strong id="high-score">0000</strong></span>
          </div>
          <canvas id="game" width="240" height="160" aria-label="Snake game board"></canvas>
          <div class="message" id="message">PRESS START</div>
        </div>
      </section>

      <div class="controls">
        <div class="dpad" aria-label="Direction controls">
          <button type="button" data-dir="up" class="up" aria-label="Move up">▲</button>
          <button type="button" data-dir="left" class="left" aria-label="Move left">◀</button>
          <button type="button" data-dir="down" class="down" aria-label="Move down">▼</button>
          <button type="button" data-dir="right" class="right" aria-label="Move right">▶</button>
        </div>
        <button type="button" id="start" class="select" aria-label="Start or restart game">START</button>
      </div>

      <div class="keypad" aria-hidden="true">
        <span>1</span><span>2</span><span>3</span>
        <span>4</span><span>5</span><span>6</span>
        <span>7</span><span>8</span><span>9</span>
        <span>*</span><span>0</span><span>#</span>
      </div>
    </div>

    <p class="hint">ARROWS / WASD · SPACE START · P PAUSE</p>\n    <p class="high-score-note" id="high-score-note">HIGH SCORE IS SAVED ON THIS DEVICE</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
