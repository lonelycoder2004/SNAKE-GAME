<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A classic Nokia-inspired Snake game for the web">
  <meta name="theme-color" content="#9bbc0f" media="(prefers-color-scheme: light)">
  <title>Nokia Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <div class="phone" role="application" aria-label="Nokia Snake game">
      <div class="brand">NOKIA</div>
      <div class="model">SNAKE II</div>
      <div class="battery" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

      <section class="screen-wrap">
        <div class="lcd">
          <div class="status" aria-live="polite">
            <span>SNAKE</span>
            <span>SCORE <strong id="score">0000</strong></span>
            <span>HI <strong id="high-score">0000</strong></span>
          </div>
          <canvas id="game" width="240" height="160" aria-label="Snake game board"></canvas>
          <div class="message" id="message">PRESS START</div>
        </div>
      </section>

      <div class="controls">
        <div class="action-buttons">
          <button type="button" id="pause" class="select secondary" aria-label="Pause or resume game">PAUSE</button>
          <button type="button" id="start" class="select" aria-label="Start or restart game">START</button>
        </div>

        <div class="dpad" aria-label="Direction controls">
          <button type="button" data-dir="up" class="up" aria-label="Move up">▲</button>
          <button type="button" data-dir="left" class="left" aria-label="Move left">◀</button>
          <button type="button" data-dir="down" class="down" aria-label="Move down">▼</button>
          <button type="button" data-dir="right" class="right" aria-label="Move right">▶</button>
        </div>
      </div>
    </div>

    <p class="hint">ARROWS / WASD · SPACE START / PAUSE · P PAUSE</p>
    <p class="high-score-note" id="high-score-note">HIGH SCORE IS SAVED ON THIS DEVICE</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
